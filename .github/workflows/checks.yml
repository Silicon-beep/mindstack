# Runs the unit tests, the build and the accessibility checks on every push to main and every pull request.
# If the accessibility checks fail, the full report is attached to the run as "accessibility-report".
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14
